<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulseMouse v0.9 · Context Pulse 效果图</title>
<style>
:root{
  --win:#0A0D10;
  --surface:rgba(255,255,255,.034);--surface-2:rgba(255,255,255,.055);--surface-3:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--line-3:rgba(255,255,255,.2);
  --text:#F2F7F8;--text-2:#A9B6BA;--text-3:#6E7D82;--text-4:#4C585C;
  --mint:#51E6CA;--mint-d:rgba(81,230,202,.12);
  --blue:#75B7FF;--blue-d:rgba(117,183,255,.12);
  --amber:#E9C46A;--amber-d:rgba(233,196,106,.12);
  --violet:#B794FF;--violet-d:rgba(183,148,255,.13);
  --coral:#E27E68;--coral-d:rgba(226,126,104,.13);
  --rose:#F38BB5;--rose-d:rgba(243,139,181,.13);
  --r-card:14px;--r-ctl:10px;--r-chip:7px;
  --f-body:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --f-mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040506;overflow:hidden;font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased}
body.real{overflow:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{flex:none}

/* ---------- desktop stage ---------- */
.desktop{position:absolute;left:50%;top:50%;width:1500px;height:1000px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1100px 700px at 25% 115%,rgba(38,66,110,.55),transparent 60%),radial-gradient(900px 600px at 88% -12%,rgba(24,86,80,.42),transparent 60%),linear-gradient(160deg,#0b1118,#06080b 60%)}
body.real .desktop{position:relative;left:auto;top:auto;margin:0 auto;transform:none!important}
.demo{position:absolute;left:16px;right:16px;top:9px;display:flex;align-items:center;gap:12px;font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap}
.demo b{color:#dfe7e9;font-weight:600}
.demo kbd{font:600 10.5px var(--f-mono);padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.2);color:#dfe7e9}
.demo>button{height:24px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.18);font-size:11.5px;color:#dfe7e9;margin-left:auto}
.demo>button:hover{background:rgba(255,255,255,.08)}
.demo .seg{padding:2px;background:rgba(0,0,0,.35)}
.demo .seg button{height:22px;padding:0 9px 0 4px;font-size:11.5px;color:#cfd6da}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(20,24,30,.9);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:6px}
.tb-app{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;position:relative;cursor:pointer}
.tb-app:hover{background:rgba(255,255,255,.05)}
.tb-app.on{background:rgba(255,255,255,.07)}
.tb-app.on::after{content:"";position:absolute;bottom:2px;left:15px;width:10px;height:3px;border-radius:2px;background:#cfd6da}
.tb-right{position:absolute;right:14px;top:0;bottom:0;display:flex;align-items:center;gap:14px;font-size:12px;color:#cfd6da}
.tray{width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.tray:hover{background:rgba(255,255,255,.08)}
.clock{text-align:right;line-height:1.3;font-size:11.5px}

/* ---------- brand mark: dot + dash ---------- */
.logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(155deg,#8EF6E2,#2CC6A9);box-shadow:0 0 14px rgba(81,230,202,.3);position:relative;display:block;flex:none}
.logo::before,.logo::after{content:"";position:absolute;top:39%;height:22%;border-radius:9px;background:#06120F}
.logo::before{left:11%;width:22%}
.logo::after{left:44%;width:44%}
.logo.dark{width:24px;height:24px;border-radius:7px;background:linear-gradient(155deg,#1D272B,#0A0F12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo.dark::before,.logo.dark::after{background:linear-gradient(#8EF6E2,#2CC6A9)}
.logo.sm{width:15px;height:15px;border-radius:4px;box-shadow:none}

/* ---------- window ---------- */
.window{position:absolute;left:140px;top:44px;width:1220px;height:820px;border-radius:10px;overflow:hidden;display:grid;grid-template-rows:44px minmax(0,1fr) 30px;
  background:radial-gradient(820px 520px at 88% -12%,rgba(81,230,202,.075),transparent 62%),radial-gradient(700px 500px at -5% 110%,rgba(117,183,255,.045),transparent 60%),var(--win);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
.window.max{left:0;top:0;width:1500px;height:952px;border-radius:0}
.window.hidden{display:none}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding-left:16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012);user-select:none}
.tb-id{display:flex;align-items:center;gap:10px}
.wordmark{font-size:12.5px;font-weight:600}
.ver{font:600 10px var(--f-mono);color:var(--mint);background:var(--mint-d);border:1px solid rgba(81,230,202,.2);padding:2px 7px;border-radius:99px}
.wc{display:flex;height:100%}
.wc button{width:46px;height:100%;display:grid;place-items:center;color:var(--text-3)}
.wc button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.wc button.close:hover{background:#c42b1c;color:#fff}
.body{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}

/* ---------- sidebar ---------- */
.sidebar{background:rgba(255,255,255,.014);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;min-height:0}
.nav-label{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--text-4);padding:0 10px 8px;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px 0 12px;border-radius:9px;color:var(--text-2);font-size:13px;position:relative;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--mint-d);color:var(--text)}
.nav-item.active::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--mint)}
.nav-item.active svg{color:var(--mint)}
.nav-item .meta{margin-left:auto;font:500 11px var(--f-mono);color:var(--text-3)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.engine{margin-top:auto;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.engine-top{display:flex;align-items:center;gap:9px}
.engine-top b{font-size:13px;font-weight:600;flex:1}
.engine-sub{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.5}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px rgba(81,230,202,.65);flex:none;animation:beat 2.4s ease-in-out infinite}
.sdot.off{background:#6b7478;box-shadow:none;animation:none}
@keyframes beat{50%{opacity:.55}}

/* ---------- main & page shell ---------- */
.main{overflow-y:auto;min-height:0;padding:22px 28px 32px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;position:relative}
.page{display:none}.page.active{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;min-height:66px}
.eyebrow{font:600 10.5px var(--f-mono);letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.page-hd .eyebrow{color:var(--mint)}
.page-hd h1{font:600 26px/1.2 var(--f-disp);letter-spacing:-.01em;margin:6px 0 4px}
.page-hd p{font-size:12.5px;color:var(--text-2)}
.page-actions{display:flex;gap:8px;align-items:center}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;position:relative}
.card::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);pointer-events:none}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-hd h3{font:600 15px var(--f-disp);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--text);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--line-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#06120f}
.btn.primary:hover{background:#6af0d6}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--coral);background:transparent;border-color:rgba(226,126,104,.28)}
.btn.danger:hover{background:var(--coral-d)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.xs{height:24px;padding:0 8px;font-size:11.5px;border-radius:7px;font-weight:500;color:var(--text-2)}
.btn.icon{width:34px;padding:0}.btn.sm.icon{width:28px}
.btn[disabled]{opacity:.35;pointer-events:none}
.field{display:grid;gap:7px;margin-bottom:15px}
.field>label{font-size:12px;color:var(--text-2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.field>label span{font:500 11px var(--f-mono);color:var(--text-3)}
.fhint{font-size:11.5px;color:var(--text-3);display:flex;gap:6px;align-items:center;line-height:1.5}
.input{height:36px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:rgba(0,0,0,.28);padding:0 12px;font-size:13px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--line-3)}
.input:focus{border-color:rgba(81,230,202,.6);box-shadow:0 0 0 3px rgba(81,230,202,.1)}
.input.mono{font-family:var(--f-mono);font-size:12.5px}
.input::placeholder{color:var(--text-4)}
.input-row{display:flex;gap:8px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button[disabled]{opacity:.4;pointer-events:none}
.seg.full{display:flex}.seg.full button{flex:1}
.seg.grid3{display:grid;grid-template-columns:repeat(3,1fr)}
.switch{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#d6dee0;transition:left .18s,background .18s}
.switch.on{background:var(--mint);border-color:var(--mint)}
.switch.on::after{left:20px;background:#06120f}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-chip);font-size:11px;font-weight:600;white-space:nowrap}
.k-app{color:var(--blue);background:var(--blue-d)}.k-folder{color:var(--amber);background:var(--amber-d)}
.k-url{color:var(--mint);background:var(--mint-d)}.k-workflow{color:var(--violet);background:var(--violet-d)}
.k-shortcut{color:var(--rose);background:var(--rose-d)}.k-repeat{color:#d6dee0;background:rgba(255,255,255,.075)}
.k-muted{color:var(--text-3);background:var(--surface-2)}
.glyph{display:inline-flex;gap:4px;align-items:center}
.glyph i{display:block;height:6px;border-radius:3px;background:currentColor}
.glyph i.d{width:6px}.glyph i.l{width:16px}
.glyph.md{gap:6px}.glyph.md i{height:8px;border-radius:4px}.glyph.md i.d{width:8px}.glyph.md i.l{width:22px}
.glyph.lg{gap:8px}.glyph.lg i{height:12px;border-radius:6px}.glyph.lg i.d{width:12px}.glyph.lg i.l{width:34px}
.pchip{display:grid;place-items:center;width:64px;height:40px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);color:var(--mint)}
.note{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.6;color:var(--text-3);padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.note svg{margin-top:2px}
.sp{flex:1}
.av{display:inline-grid;place-items:center;border-radius:5px;background:var(--c);color:#fff;font-weight:700;flex:none;line-height:1;font-family:var(--f-body)}
kbd{font:600 11px var(--f-mono);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:rgba(255,255,255,.04);color:var(--text-2)}
.keys{display:inline-flex;align-items:center;gap:3px}
.keys em{font-style:normal;color:var(--text-4);font-size:10px}
.lockic{color:var(--text-3);display:inline-flex}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px 18px}
.stat .v{font:600 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--text-2);margin-top:4px}
.stat .s{font-size:11.5px;color:var(--text-3);margin-top:8px;display:flex;gap:6px;align-items:center}
.dash-row{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-bottom:14px}
.dash-row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.state{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface)}
.state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.state.live{color:var(--mint);border-color:rgba(81,230,202,.3);background:var(--mint-d)}
.state.bad{color:var(--coral);border-color:rgba(226,126,104,.3);background:var(--coral-d)}
.ctxchip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 5px;border-radius:99px;border:1px solid var(--line-2);font-size:11.5px;color:var(--text-2);background:var(--surface)}
.ctxchip b{color:var(--text);font-weight:600}
.hero{padding:18px 22px 16px;user-select:none}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 16px}
.slot{width:74px;height:60px;border-radius:12px;border:1px dashed rgba(255,255,255,.12);display:grid;place-items:center;color:var(--mint);background:rgba(0,0,0,.16);transition:border-color .15s,background .15s,box-shadow .15s}
.slot.filled{border-style:solid;border-color:rgba(81,230,202,.35);background:var(--mint-d);box-shadow:0 0 24px rgba(81,230,202,.12)}
.slot.next{border-color:rgba(81,230,202,.4)}
.slot.pressing{border-style:solid;border-color:var(--mint);animation:press .8s ease-in-out infinite}
.slot.miss{border-color:rgba(226,126,104,.4);background:var(--coral-d);color:var(--coral)}
@keyframes press{50%{box-shadow:0 0 0 4px rgba(81,230,202,.14)}}
.hero-state{text-align:center;font:600 19px var(--f-disp);display:flex;justify-content:center;align-items:center;gap:10px;min-height:28px}
.hero-sub{text-align:center;font-size:12px;color:var(--text-3);min-height:18px;margin-top:3px}
.ruler{position:relative;padding-top:20px;margin-top:14px}
.rz{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.03)}
.z{position:absolute;top:0;bottom:0}
.z.dot{background:rgba(81,230,202,.42);border-radius:2px}
.z.dash{background:rgba(117,183,255,.38);border-radius:2px}
.z.amb{background:repeating-linear-gradient(135deg,rgba(226,126,104,.3) 0 4px,transparent 4px 8px)}
.z.inv{background:rgba(255,255,255,.035)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;left:0;box-shadow:0 0 10px rgba(255,255,255,.55);opacity:0;transition:opacity .15s}
.needle.on{opacity:1}
.needle em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 10.5px var(--f-mono);font-style:normal;white-space:nowrap;margin-bottom:3px;color:var(--text)}
.rl{position:relative;height:16px;margin-top:8px;font-size:11px;color:var(--text-3)}
.rl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rl span.amb{color:rgba(226,126,104,.85)}
.holdbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:12px;font-size:11px;color:var(--text-3)}
.hold-track{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.hold-track i{display:block;height:100%;width:0;background:var(--mint)}
.cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;min-height:28px}
.cands>span:first-child{font-size:11px;color:var(--text-3);margin-right:4px;display:inline-flex;gap:6px;align-items:center}
.cand{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:11.5px;color:var(--text-2)}
.cand .glyph{color:var(--text-3)}
.cand.own{border-color:rgba(81,230,202,.3)}
.cand.hit{color:var(--text)}.cand.hit .glyph{color:var(--mint)}
.cand.exact{background:var(--mint-d);border-color:rgba(81,230,202,.4)}
.hero-ft{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-ft .hint{flex:1;font-size:11.5px;color:var(--text-3);display:flex;gap:6px;align-items:center}
.radio-list{display:grid;gap:6px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.15);text-align:left;width:100%;transition:border-color .15s,background .15s}
.radio:hover{border-color:var(--line-2)}
.radio .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-3);margin-top:1px;flex:none;position:relative}
.radio.on{border-color:rgba(81,230,202,.35);background:var(--mint-d)}
.radio.on .rd{border-color:var(--mint)}.radio.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--mint)}
.radio b{font-size:12.5px;font-weight:600;display:block}
.radio small{font-size:11px;color:var(--text-3);display:block;margin-top:2px;line-height:1.45}
.act{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.ic.ok{color:var(--mint);background:var(--mint-d)}.ic.miss{color:var(--coral);background:var(--coral-d)}.ic.sys{color:var(--text-3);background:var(--surface-2)}
.act .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .s{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden}
.act .s .glyph{color:var(--text-2)}
.act .ctx{display:inline-flex;align-items:center;gap:5px;color:var(--text-2)}
.act time{font:11px var(--f-mono);color:var(--text-3)}
.log{font:11.5px/1.85 var(--f-mono);color:var(--text-2);height:262px;overflow:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px;border:1px solid var(--line);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .tm{color:var(--text-4)}.log .hit{color:var(--mint)}.log .pass{color:var(--text-3)}.log .err{color:var(--coral)}

/* ---------- commands: rhythm map, list, inspector ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 364px;gap:14px;align-items:start}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:150px}
.search svg{position:absolute;left:11px;top:10px;color:var(--text-3)}
.search .input{padding-left:34px}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--text-3);flex:1;justify-content:flex-end}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--surface);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.map.off .cell.own,.map.off .cell.inh{opacity:.45}
.mapoff{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--amber);background:var(--amber-d);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:72px repeat(var(--cols),minmax(150px,1fr));min-width:calc(72px + var(--cols) * 150px);border-bottom:1px solid var(--line)}
.colx{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);opacity:.35;margin-left:4px;transition:opacity .15s,background .15s}
.mhd>div:hover .colx{opacity:1}
.colx:hover{background:var(--coral-d);color:var(--coral)}
.btn.danger-solid{background:var(--coral);border-color:var(--coral);color:#1a0b07}
.btn.danger-solid:hover{background:#ec9180}
.trow.pick{grid-template-columns:22px minmax(0,1fr) auto}
.trow.pick .proc{font:11px var(--f-mono);color:var(--text-3);margin-left:6px}
.trow.rm{grid-template-columns:58px minmax(0,1fr) auto;pointer-events:none}
.mrow:last-child{border-bottom:0}
.mhd{background:rgba(0,0,0,.25);font-size:12px;color:var(--text-2)}
.mhd>div{padding:10px 10px;display:flex;align-items:center;gap:7px;font-weight:600;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.mhd>div:last-child{border-right:0}
.mhd .here{margin-left:auto;font:600 9.5px var(--f-mono);letter-spacing:.06em;color:var(--mint);display:inline-flex;align-items:center;gap:4px}
.mhd .here i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(81,230,202,.7)}
.mp{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mint);border-right:1px solid var(--line);background:rgba(0,0,0,.12)}
.mrow.pinned .mp{color:var(--text-2)}
.cell{min-height:50px;padding:7px 10px;border-right:1px solid var(--line);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative;width:100%;min-width:0;transition:background .12s}
.cell:last-child{border-right:0}
.cell .cn{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.cell .cs{font:10.5px var(--f-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;display:flex;gap:6px;align-items:center}
.cell .cs kbd{font-size:10px;padding:0 4px}
.cell:hover{background:rgba(255,255,255,.04)}
.cell.here{background:rgba(81,230,202,.025)}
.cell.inh .cn{color:var(--text-3);font-weight:500}
.cell.free .cn{color:var(--text-4);font-weight:500}
.cell.free:hover .cn{color:var(--text-2)}
.cell.own{background:rgba(81,230,202,.07);box-shadow:inset 3px 0 0 var(--mint)}
.cell.own.rep{background:rgba(233,196,106,.07);box-shadow:inset 3px 0 0 var(--amber)}
.cell.lock{cursor:not-allowed;background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 6px,transparent 6px 12px)}
.cell.lock .cn{color:var(--text-4);font-weight:500}
.cell.sel{outline:1.5px solid var(--mint);outline-offset:-2px;z-index:1}
.cell .cnt{margin-left:auto;font:500 10px var(--f-mono);color:var(--text-4)}
.grp{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:11.5px;color:var(--text-3)}
.grp:first-child{margin-top:2px}
.grp b{color:var(--text);font-size:12.5px;font-weight:600}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:background .15s,border-color .15s}
.item:hover{background:var(--surface-2);border-color:var(--line-2)}
.item.sel{border-color:rgba(81,230,202,.4);background:rgba(81,230,202,.055);box-shadow:inset 3px 0 0 var(--mint)}
.item .n{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.item .tg{font:11.5px var(--f-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;margin-top:5px;display:flex;align-items:center;gap:8px}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.rep-chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:6px;font:600 10.5px var(--f-body);color:var(--amber);background:var(--amber-d);white-space:nowrap}
.muted-chip{font:11px var(--f-body);color:var(--text-3);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.use{display:flex;align-items:center;gap:7px;font:600 11px var(--f-mono);color:var(--text-2)}
.use.cold{color:var(--text-4)}
.heat{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.heat i{width:3px;border-radius:1px;background:var(--mint);display:block}
.heat i.zero{background:rgba(255,255,255,.12)}
.heat.big{height:46px;gap:6px;width:100%}
.heat.big i{flex:1;width:auto;border-radius:3px}
.inspector{position:sticky;top:0;padding:0;overflow:hidden}
.insp-hd{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.insp-hd h3{font:600 15px var(--f-disp);margin-top:5px;display:flex;align-items:center;gap:8px}
.insp-bd{padding:16px 18px 2px}
.insp-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.16)}
.apps{display:flex;flex-wrap:wrap;gap:6px}
.appchip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 6px;border-radius:9px;border:1px solid var(--line-2);background:rgba(0,0,0,.2);font-size:12px;color:var(--text-2);transition:border-color .15s,background .15s}
.appchip:hover{border-color:var(--line-3);color:var(--text)}
.appchip.on{border-color:rgba(81,230,202,.45);background:var(--mint-d);color:var(--text)}
.appchip.ghost{border-style:dashed;padding-left:9px}
.pinrow{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.2)}
.pinrow .pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);flex:none}
.pinrow.on .pi{background:var(--mint-d);color:var(--mint)}
.pinrow b{font-size:12.5px;font-weight:600;display:block}
.pinrow small{font-size:11px;color:var(--text-3);display:block;margin-top:2px;line-height:1.45}
.where{display:grid;gap:5px}
.where div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-2);padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.18)}
.composer{border:1px solid var(--line-2);border-radius:12px;background:rgba(0,0,0,.22);padding:10px}
.cslots{display:flex;gap:6px;margin-bottom:10px}
.cslot{flex:1;height:40px;border-radius:9px;border:1px dashed rgba(255,255,255,.12);display:grid;place-items:center;color:var(--mint)}
.cslot.filled{border-style:solid;border-color:rgba(81,230,202,.3);background:var(--mint-d)}
.cslot.err{border-color:rgba(226,126,104,.4);background:var(--coral-d);color:var(--coral)}
.cslot.warn{border-color:rgba(233,196,106,.42);background:var(--amber-d);color:var(--amber)}
.cbtns{display:flex;gap:6px;align-items:center}
.cbtns .glyph{color:var(--mint)}
.cmsg{font-size:11.5px;margin-top:9px;display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.cmsg svg{margin-top:2px}
.cmsg.ok{color:var(--mint)}.cmsg.err{color:var(--coral)}.cmsg.warn{color:var(--amber)}.cmsg.muted{color:var(--text-3)}
.sugg{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.sugg .btn{color:var(--mint)}
.keycap{min-height:40px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.28);display:flex;align-items:center;gap:5px;padding:0 12px;outline:none;cursor:text}
.keycap:hover{border-color:var(--line-3)}
.keycap:focus{border-color:rgba(81,230,202,.6);box-shadow:0 0 0 3px rgba(81,230,202,.1)}
.keycap kbd{font-size:12.5px;padding:3px 8px;color:var(--text)}
.keycap .ph{color:var(--text-4);font-size:12.5px}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.usage .days{display:flex;gap:6px;margin-top:5px}
.usage .days span{flex:1;text-align:center;font:10.5px var(--f-mono);color:var(--text-4)}
.usage .days span.today{color:var(--text-2)}
.empty{padding:26px 18px;text-align:center;color:var(--text-3);font-size:12.5px;border:1px dashed var(--line-2);border-radius:12px}

/* settings */
.settings-wrap{max-width:840px}
.sgroup{margin-bottom:20px}
.sgroup-t{font-size:12px;font-weight:600;color:var(--text-2);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.srows{padding:2px 18px}
.srow{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);min-height:62px}
.srow:last-child{border-bottom:0}
.srow .info{flex:1;min-width:0}
.srow .nm{font-size:13px;font-weight:600}
.srow .ds{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.srow .ctl{display:flex;align-items:center;gap:10px}
.new{font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--mint);border:1px solid rgba(81,230,202,.3);border-radius:5px;padding:1px 5px}

/* status bar, toast, modal */
.statusbar{display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--line);background:rgba(0,0,0,.28);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.sb{display:flex;align-items:center;gap:7px}
.sb .sdot{width:7px;height:7px}
.toast{position:absolute;left:50%;bottom:44px;transform:translate(-50%,8px);background:#192026;border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:30;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--mint)}
.modal-bg{position:absolute;inset:44px 0 0 0;background:rgba(4,6,8,.62);display:none;place-items:center;z-index:20}
.modal-bg.show{display:grid;animation:in .15s ease}
.modal{width:600px;border-radius:14px;background:#12171c;border:1px solid var(--line-2);box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden}
.tpl{padding:20px 20px 10px}
.tpl-hd{display:flex;gap:14px;margin-bottom:16px}
.modal-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--mint);background:var(--mint-d)}
.modal h4{font:600 15px var(--f-disp);margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.tpl .field{margin-bottom:12px}
.trow{display:grid;grid-template-columns:20px 58px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.16);margin-bottom:6px;width:100%;text-align:left;font-size:12.5px}
.trow:hover{border-color:var(--line-2)}
.trow.dis{opacity:.5;pointer-events:none}
.trow .glyph{color:var(--mint)}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-3);display:grid;place-items:center;color:#06120f}
.cb.on{background:var(--mint);border-color:var(--mint)}
.st{font-size:11px;font-weight:600;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.st .glyph{color:inherit}
.st.ok{color:var(--text-3)}.st.warn{color:var(--amber)}.st.dis{color:var(--text-3)}.st.move{color:var(--blue)}
.modal-ft{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(0,0,0,.22);border-top:1px solid var(--line)}
.ft-note{font-size:11.5px;color:var(--text-3);display:inline-flex;gap:6px;align-items:center}

/* ---------- on-screen capsule + rhythm hint (FeedbackWindow) ---------- */
.capsule{position:absolute;bottom:70px;left:50%;translate:-50% 0;height:56px;min-width:400px;max-width:560px;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 24px 0 10px;background:rgba(14,18,22,.97);border:1px solid rgba(81,230,202,.44);box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:40}
.capsule.show{opacity:1;transform:none}
.capsule .orb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint-d);color:var(--mint);flex:none}
.capsule .cp{color:var(--mint);display:flex;align-items:center;min-width:24px}
.capsule .div{width:1px;height:22px;background:var(--line-2)}
.capsule .ct{display:grid;gap:2px;min-width:0;flex:1}
.capsule .ct small{font:600 10.5px var(--f-body);letter-spacing:.02em;color:var(--text-3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.capsule .ct small b{color:var(--text-2);font-weight:600}
.capsule .ct span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capsule.failed{border-color:rgba(226,126,104,.8)}
.capsule.failed .orb{color:var(--coral);background:var(--coral-d)}.capsule.failed .cp{color:var(--coral)}
.capsule.remind{border-color:rgba(233,196,106,.7)}
.capsule.remind .ct small,.capsule.remind .ct small b{color:var(--amber)}
.capsule.breath{animation:breath 1.8s ease-in-out infinite}
@keyframes breath{50%{opacity:.74}}
.hintcard{position:absolute;bottom:136px;left:50%;translate:-50% 0;width:420px;border-radius:16px;background:rgba(14,18,22,.97);border:1px solid var(--line-2);box-shadow:0 14px 40px rgba(0,0,0,.5);padding:10px 10px 8px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none;z-index:40}
.hintcard.show{opacity:1;transform:none}
.hint-hd{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:5px}
.hint-hd b{font-weight:600}
.hint-hd span{margin-left:auto;color:var(--text-3);font-size:11px}
.hrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;height:30px;padding:0 6px;border-radius:8px;font-size:12.5px;color:var(--text-2)}
.hrow .glyph i{background:var(--text-4)}
.hrow .glyph i.on{background:var(--mint)}
.hrow.exact{background:var(--mint-d);color:var(--text)}
.hrow em{font-style:normal;font-size:10.5px;color:var(--text-3);display:inline-flex;gap:5px;align-items:center}
.hrow em.rep{color:var(--amber)}
.hrow.none{grid-template-columns:1fr;color:var(--text-3);font-size:12px}
.hmore{font-size:11px;color:var(--text-3);padding:4px 6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="desktop" id="desktop">
  <div class="demo">
    <b>PulseMouse v0.9 · Context Pulse 效果图</b>
    <span>光标所在程序</span><div class="seg" id="ctxSeg"></div>
    <span>按住 <kbd>R</kbd> 当右键，<kbd>Space</kbd> 当左键敲节奏（≤300ms 点，≥500ms 划），松开 <kbd>R</kbd> 执行，滚轮取消</span>
    <button id="fitBtn" data-act="fit">切换 100% 尺寸</button>
  </div>

  <div class="window" id="win">
    <header class="titlebar" id="titlebar">
      <div class="tb-id"><span class="logo"></span><span class="wordmark">PulseMouse</span><span class="ver">v0.9</span></div>

        <button class="close" data-act="win-close" title="隐藏到托盘"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></button>
      </div>
    </header>
    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main">
        <section class="page" id="page-dashboard"></section>
        <section class="page" id="page-commands"></section>
        <section class="page" id="page-gestures"></section>
        <section class="page" id="page-workflows"></section>
        <section class="page" id="page-settings"></section>

  </div>

  <div class="taskbar" id="taskbar"></div>
</div>

/* ============ two layers: global + per-app ============ */
const globalOf=p=>S.commands.find(c=>!c.scope&&c.pattern===p);
const ownOf=(app,p)=>S.commands.find(c=>c.scope===app&&c.pattern===p);
const layerApps=()=>S.apps;
const ensureApp=a=>{if(a&&!S.apps.includes(a))S.apps.push(a)};
const ownCount=app=>S.set.context?S.commands.filter(c=>c.scope===app).length:0;
function resolve(p,app){
  const g=globalOf(p);
  if(g&&g.pinned)return g;
  if(S.set.context&&app){const a=ownOf(app,p);if(a)return a}
  return g||null;
}
function available(app){
  const pats=[...new Set(S.commands.filter(c=>!c.scope||(S.set.context&&c.scope===app)).map(c=>c.pattern))].sort((a,b)=>pidx(a)-pidx(b));
  return pats.map(p=>resolve(p,app)).filter(Boolean);
}
function freePatterns(app,exclude=new Set(),n=3){
  const out=[];
  for(const p of ALLP){if(out.length>=n)break;if(exclude.has(p)||globalOf(p))continue;if(app&&ownOf(app,p))continue;if(!app&&S.commands.some(c=>c.pattern===p))continue;out.push(p)}
  return out;
}

  }
  const n=$('#hr-n'),v=$('#hr-v'),s=S.set;
  if(pressing){const d=now-CH.pDown;n.classList.add('on');n.style.left=pct(d);v.textContent=Math.round(d)+' ms';n.style.background=d<=s.shortMax?'var(--mint)':d<s.longMin||d>s.longMax?'var(--coral)':'var(--blue)'}

/* ============ chord simulation (R = right button, Space = left button) ============ */
const CH={down:null,pDown:null,seq:'',ctx:null,phase:'idle',lastDur:null,lastPulse:null,hit:null,msg:'',armT:null,hintT:null,idleT:null};
function chordDown(){
  if(!S.enabled){toast('监听已暂停','info');return}

  log(`右键 按下 · 光标下：${APPS[CH.ctx].n}`,'hit','[扣住] 等待左键');
  CH.armT=setTimeout(()=>{if(CH.down!=null&&!CH.seq&&CH.pDown==null){capsule('armed','','用左键敲节奏；不敲直接松开即普通右键');showHint('')}},600);
}
function pulseDown(){
  if(CH.down==null){toast('先按住 R（模拟右键），再用 Space 敲节奏','info');return}

  CH.pDown=performance.now();CH.phase='press';clearTimeout(CH.hintT);clearTimeout(CH.armT);hideHint();

}
function pulseUp(){
  if(CH.pDown==null)return;

  const p=d<35||d>s.longMax?null:d<=s.shortMax?'.':d>=s.longMin?'-':null;
  if(!p){CH.lastPulse='x';CH.seq='';CH.phase='reset';CH.msg=`左键按住 ${Math.round(d)} ms 无法判定（${s.shortMax}–${s.longMin} ms 之间或过长），本次作废`;capsule('failed','','无法判定的按压，已作废');log(CH.msg,'err','');return}
  CH.lastPulse=p;CH.seq+=p;CH.phase='typing';
  const m=resolve(CH.seq,CH.ctx);
  capsule('typing',CH.seq,m?m.name:'正在输入…',m);
  log(`左键 释放，时长 ${Math.round(d)} ms → ${p==='.'?'·':'—'}`,'hit','[节奏]');
  CH.hintT=setTimeout(()=>{if(CH.down!=null&&CH.pDown==null&&CH.phase==='typing')showHint(CH.seq)},600);
}
function chordUp(){
  if(CH.down==null)return;

  if(phase==='cancel'||phase==='reset'){idleLater();return}
  if(!seq){hideCapsule();CH.phase='idle';log('右键 松开','pass','[补发] 没有节奏，补发右键单击');toast('普通右键：已补发右键单击，右键菜单照常弹出','info');return}
  log('右键 松开','hit',`[提交] ${ptxt(seq)}`);
  const c=resolve(seq,CH.ctx);
  if(c){CH.phase='matched';CH.hit={c,pat:seq};run(c,seq,CH.ctx)}
  else{CH.phase='miss';CH.hit={pat:seq};S.stats.miss++;capsule('failed',seq,'未找到匹配的指令');addActivity({type:'miss',title:'未找到匹配的指令',p:seq,ctx:CH.ctx});log(`${APPS[CH.ctx].n} 中没有匹配的指令：${seq}`,'err','')}

}
function chordCancel(){

function run(c,seq,ctx){
  if(c.kind==='repeat'){

    CH.hit.label=`重复：${S.last.c.name}`;

function saveCmd(){
  const d=S.draft;
  if(!d.name.trim())return toast('请填写名称','alert');
  if(!d.pattern)return toast('请添加 1–5 位节奏','alert');
  const m=patMsg(d);if(m[0]==='err')return toast(m[2],'alert');
  if(d.kind==='shortcut'&&!d.target)return toast('请录入快捷键','alert');
  if(['app','folder','url'].includes(d.kind)&&!String(d.target).trim())return toast('目标不能为空','alert');
  if(!d.scope&&!d.pinManual)d.pinned=autoPin(d);
  if(d.scope){delete d.pinned;ensureApp(d.scope);if(globalOf(d.pattern)&&d.remind==null)d.remind=5}
  if(d.id){const i=S.commands.findIndex(c=>c.id===d.id);S.commands[i]=clone(d)}else{d.id=++uid;S.commands.push(clone(d))}
  S.cmdSel=d.id;saved();toast(`已保存「${d.name}」${d.scope?`（${APPS[d.scope].n} 中的含义）`:''}`);renderSidebar();renderCommands();
}

/* ============ template modal ============ */
function tplRows(){
  const app=S.tpl.app;
  const rows=TEMPLATE.items.map((it,i)=>{
    const exist=ownOf(app,it.pattern),g=globalOf(it.pattern);
    let st,pat=it.pattern;
    if(exist&&exist.name===it.name)st=['dis','已添加'];
    else if(exist)st=['move',`${APPS[app].n} 中已是「${exist.name}」，改用`];
    else if(g&&g.pinned)st=['move',`「${g.name}」已固定，改用`];
    else if(g)st=['warn',`在 ${APPS[app].n} 中替换全局「${g.name}」`];
    else st=['ok','空闲节奏'];
    return {it,i,st,pat};
  });
  const taken=new Set(rows.filter(r=>r.st[0]!=='move').map(r=>r.pat));
  rows.filter(r=>r.st[0]==='move').forEach(r=>{r.pat=freePatterns(app,taken,1)[0];taken.add(r.pat)});
  rows.forEach(r=>{r.on=r.st[0]==='dis'?false:(S.tpl.pick[app+r.i]??(r.st[0]==='ok'||r.st[0]==='move'))});
  return rows;
}

  return `<div class="modal"><div class="tpl">
    <div class="tpl-hd"><span class="modal-ic">${ic('template',18)}</span><div><h4>从模板添加程序含义</h4><p>只在所选程序中生效，逐条确认后才添加。固定的节奏会自动换成空闲节奏；会替换全局含义的条目默认不勾选。</p></div></div>
    <div class="field"><label>模板</label><div class="seg"><button class="on">${ic('url',14)}浏览器</button><button disabled>会议 · v0.10</button><button disabled>演示 · v0.10</button></div></div>

    ${rows.map(r=>`<button class="trow ${r.st[0]==='dis'?'dis':''}" data-act="tpl-toggle" data-i="${r.i}"><span class="cb ${r.on?'on':''}">${r.on?ic('check',13):''}</span>${glyph(r.pat,'md')}<span>${esc(r.it.name)}</span>${keys(r.it.target)}${stHTML(r)}</button>`).join('')}

  'tpl-app':a=>{S.tpl.app=a.dataset.k;openTpl()},
  'tpl-toggle':a=>{const r=tplRows()[+a.dataset.i];S.tpl.pick[S.tpl.app+r.i]=!r.on;openTpl()},
  'tpl-apply':()=>{const app=S.tpl.app,add=tplRows().filter(r=>r.on);ensureApp(app);add.forEach(r=>S.commands.push({id:++uid,name:r.it.name,pattern:r.pat,kind:'shortcut',target:r.it.target,scope:app,heat:[0,0,0,0,0,0,0],last:'',lastApp:'',remind:globalOf(r.pat)?5:0}));
    closeModal();selectCmd(uid);saved();toast(`已添加 ${add.length} 条 ${APPS[app].n} 含义`);renderSidebar();renderCommands()},
  'modal-close':closeModal,
  'set-toggle':a=>{const k=a.dataset.k;S.set[k]=!S.set[k];a.classList.toggle('on',S.set[k]);saved();renderSidebar();renderStatus()},
};
function refreshCommandsInspector(){const y=$('#cmd-insp').scrollTop;$('#cmd-insp').innerHTML=cmdInspectorHTML();$('#cmd-insp').scrollTop=y}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=H[a.dataset.act];if(f)f(a,e)});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.bind&&S.draft){S.draft[ds.bind]=t.value}
  else if(t.id==='cmd-q'){S.cmdQuery=t.value;$('#cmd-body').innerHTML=listHTML()}
});
const KEYMAP={ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down',' ':'Space',Escape:'Esc'};
function captureKey(e){
  e.preventDefault();
  if(e.key==='Backspace'){S.draft.target='';$('#keycap').innerHTML='<span class="ph">点这里，然后按下组合键</span>';return}
  if(['Control','Shift','Alt','Meta'].includes(e.key))return;
  const mods=[];if(e.ctrlKey)mods.push('Ctrl');if(e.shiftKey)mods.push('Shift');if(e.altKey)mods.push('Alt');if(e.metaKey)mods.push('Win');
  const k=KEYMAP[e.key]||(e.key.length===1?e.key.toUpperCase():e.key);
  S.draft.target=[...mods,k].join('+');$('#keycap').innerHTML=keys(S.draft.target);
}
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.id==='keycap')};
document.addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.id==='keycap')return captureKey(e);
  if(typing())return;
  if(e.code==='KeyR'){e.preventDefault();if(!e.repeat)chordDown()}
  else if(e.code==='Space'){e.preventDefault();if(!e.repeat)pulseDown()}
  else if(e.key==='Escape'&&$('#modal').classList.contains('show'))closeModal();
});
document.addEventListener('keyup',e=>{
  if(typing())return;
  if(e.code==='KeyR')chordUp();
  else if(e.code==='Space')pulseUp();
});
document.addEventListener('wheel',e=>{if(CH.down!=null){e.preventDefault();chordCancel()}},{passive:false});
$('#titlebar').addEventListener('dblclick',e=>{if(!e.target.closest('button'))H['win-max']()});
function fit(){const d=$('#desktop');if(document.body.classList.contains('real')){d.style.transform='none';return}const s=Math.min(innerWidth/1500,innerHeight/1000);d.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);
setInterval(()=>{const c=$('#clock');if(c)c.textContent=new Date().toTimeString().slice(0,5)},10000);

fit();renderDemo();renderStatus();go('commands');requestAnimationFrame(loop);
</script>
</body>
