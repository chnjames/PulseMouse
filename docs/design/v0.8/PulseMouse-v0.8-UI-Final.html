<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulseMouse v0.8 · UI 定稿效果图</title>
<style>
:root{
  --win:#0A0D10;
  --surface:rgba(255,255,255,.034);--surface-2:rgba(255,255,255,.055);--surface-3:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--line-3:rgba(255,255,255,.2);
  --text:#F2F7F8;--text-2:#A9B6BA;--text-3:#6E7D82;--text-4:#4C585C;
  --mint:#51E6CA;--mint-d:rgba(81,230,202,.12);
  --blue:#75B7FF;--blue-d:rgba(117,183,255,.12);
  --amber:#E9C46A;--amber-d:rgba(233,196,106,.12);
  --violet:#B794FF;--violet-d:rgba(183,148,255,.13);
  --coral:#E27E68;--coral-d:rgba(226,126,104,.13);
  --r-card:14px;--r-ctl:10px;--r-chip:7px;
  --f-body:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --f-disp:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  --f-mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040506;overflow:hidden;font-family:var(--f-body);color:var(--text);-webkit-font-smoothing:antialiased}
body.real{overflow:auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{flex:none}

/* ---------- desktop stage ---------- */
.desktop{position:absolute;left:50%;top:50%;width:1500px;height:1000px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1100px 700px at 25% 115%,rgba(38,66,110,.55),transparent 60%),radial-gradient(900px 600px at 88% -12%,rgba(24,86,80,.42),transparent 60%),linear-gradient(160deg,#0b1118,#06080b 60%)}
body.real .desktop{position:relative;left:auto;top:auto;margin:0 auto;transform:none!important}
.demo{position:absolute;left:16px;top:11px;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.55)}
.demo b{color:#dfe7e9;font-weight:600}
.demo kbd{font:600 10.5px var(--f-mono);padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.2);color:#dfe7e9}
.demo button{height:24px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.18);font-size:11.5px;color:#dfe7e9}
.demo button:hover{background:rgba(255,255,255,.08)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(20,24,30,.9);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:6px}
.tb-app{width:40px;height:40px;border-radius:6px;display:grid;place-items:center}
.tb-app i{width:22px;height:22px;border-radius:6px;display:block}
.tb-app.active{background:rgba(255,255,255,.06);position:relative}
.tb-app.active::after{content:"";position:absolute;bottom:2px;left:15px;width:10px;height:3px;border-radius:2px;background:var(--mint)}
.tb-right{position:absolute;right:14px;top:0;bottom:0;display:flex;align-items:center;gap:14px;font-size:12px;color:#cfd6da}
.tray{width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.tray:hover{background:rgba(255,255,255,.08)}
.tray .logo{width:14px;height:14px}
.clock{text-align:right;line-height:1.3;font-size:11.5px}

/* ---------- window ---------- */
.window{position:absolute;left:140px;top:44px;width:1220px;height:820px;border-radius:10px;overflow:hidden;display:grid;grid-template-rows:44px minmax(0,1fr) 30px;
  background:radial-gradient(820px 520px at 88% -12%,rgba(81,230,202,.075),transparent 62%),radial-gradient(700px 500px at -5% 110%,rgba(117,183,255,.045),transparent 60%),var(--win);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)}
.window.max{left:0;top:0;width:1500px;height:952px;border-radius:0}
.window.hidden{display:none}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding-left:16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.012);user-select:none}
.tb-id{display:flex;align-items:center;gap:10px}
.logo{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9effee,var(--mint) 55%,#1f9e87);box-shadow:0 0 14px rgba(81,230,202,.35);position:relative;display:block}
.logo::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#07100e}
.wordmark{font-size:12.5px;font-weight:600}
.ver{font:600 10px var(--f-mono);color:var(--mint);background:var(--mint-d);border:1px solid rgba(81,230,202,.2);padding:2px 7px;border-radius:99px}
.wc{display:flex;height:100%}
.wc button{width:46px;height:100%;display:grid;place-items:center;color:var(--text-3)}
.wc button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.wc button.close:hover{background:#c42b1c;color:#fff}
.body{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}

/* ---------- sidebar ---------- */
.sidebar{background:rgba(255,255,255,.014);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;min-height:0}
.nav-label{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--text-4);padding:0 10px 8px;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px 0 12px;border-radius:9px;color:var(--text-2);font-size:13px;position:relative;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--mint-d);color:var(--text)}
.nav-item.active::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--mint)}
.nav-item.active svg{color:var(--mint)}
.nav-item .meta{margin-left:auto;font:500 11px var(--f-mono);color:var(--text-3)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.engine{margin-top:auto;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.engine-top{display:flex;align-items:center;gap:9px}
.engine-top b{font-size:13px;font-weight:600;flex:1}
.engine-sub{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.5}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px rgba(81,230,202,.65);flex:none;animation:beat 2.4s ease-in-out infinite}
.sdot.off{background:#6b7478;box-shadow:none;animation:none}
@keyframes beat{50%{opacity:.55}}

/* ---------- main & page shell ---------- */
.main{overflow-y:auto;min-height:0;padding:22px 28px 32px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;position:relative}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
.page{display:none}.page.active{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;min-height:66px}
.eyebrow{font:600 10.5px var(--f-mono);letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.page-hd .eyebrow{color:var(--mint)}
.page-hd h1{font:600 26px/1.2 var(--f-disp);letter-spacing:-.01em;margin:6px 0 4px}
.page-hd p{font-size:12.5px;color:var(--text-2)}
.page-actions{display:flex;gap:8px;align-items:center}
.hd-switch{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);height:34px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface)}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;position:relative}
.card::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);pointer-events:none}
.card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-hd h3{font:600 15px var(--f-disp);margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--text);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--line-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#06120f}
.btn.primary:hover{background:#6af0d6}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--coral);background:transparent;border-color:rgba(226,126,104,.28)}
.btn.danger:hover{background:var(--coral-d)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.icon{width:34px;padding:0}.btn.sm.icon{width:28px}
.btn[disabled]{opacity:.35;pointer-events:none}
.field{display:grid;gap:7px;margin-bottom:15px}
.field>label{font-size:12px;color:var(--text-2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.field>label span{font:500 11px var(--f-mono);color:var(--text-3)}
.fhint{font-size:11.5px;color:var(--text-3)}
.input{height:36px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:rgba(0,0,0,.28);padding:0 12px;font-size:13px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--line-3)}
.input:focus{border-color:rgba(81,230,202,.6);box-shadow:0 0 0 3px rgba(81,230,202,.1)}
.input.mono{font-family:var(--f-mono);font-size:12.5px}
.input::placeholder{color:var(--text-4)}
.input-row{display:flex;gap:8px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg.icons button{width:30px;padding:0}
.switch{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#d6dee0;transition:left .18s,background .18s}
.switch.on{background:var(--mint);border-color:var(--mint)}
.switch.on::after{left:20px;background:#06120f}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-chip);font-size:11px;font-weight:600;white-space:nowrap}
.k-app{color:var(--blue);background:var(--blue-d)}.k-folder{color:var(--amber);background:var(--amber-d)}
.k-url{color:var(--mint);background:var(--mint-d)}.k-workflow{color:var(--violet);background:var(--violet-d)}
.k-muted{color:var(--text-3);background:var(--surface-2)}
.glyph{display:inline-flex;gap:4px;align-items:center}
.glyph i{display:block;height:6px;border-radius:3px;background:currentColor}
.glyph i.d{width:6px}.glyph i.l{width:16px}
.glyph.md{gap:6px}.glyph.md i{height:8px;border-radius:4px}.glyph.md i.d{width:8px}.glyph.md i.l{width:22px}
.glyph.lg{gap:8px}.glyph.lg i{height:12px;border-radius:6px}.glyph.lg i.d{width:12px}.glyph.lg i.l{width:34px}
.pchip{display:grid;place-items:center;width:64px;height:40px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);color:var(--mint)}
.note{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.6;color:var(--text-3);padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.note svg{margin-top:2px;color:var(--text-3)}
.range{-webkit-appearance:none;appearance:none;width:200px;height:4px;border-radius:2px;outline:none;--p:50%;background:linear-gradient(to right,var(--mint) var(--p),rgba(255,255,255,.12) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#e9f2f1;border:3px solid var(--mint);box-shadow:0 0 0 4px rgba(81,230,202,.12);cursor:pointer}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#e9f2f1;border:3px solid var(--mint);cursor:pointer}
.val{font:600 12px var(--f-mono);min-width:68px;text-align:right;color:var(--text)}

/* ---------- dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px 18px}
.stat .v{font:600 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--text-2);margin-top:4px}
.stat .s{font-size:11.5px;color:var(--text-3);margin-top:8px}
.dash-row{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-bottom:14px}
.dash-row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.state{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface)}
.state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.state.live{color:var(--mint);border-color:rgba(81,230,202,.3);background:var(--mint-d)}
.state.bad{color:var(--coral);border-color:rgba(226,126,104,.3);background:var(--coral-d)}
.hero{padding:18px 22px 16px;user-select:none}
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 16px}
.slot{width:74px;height:60px;border-radius:12px;border:1px dashed rgba(255,255,255,.12);display:grid;place-items:center;color:var(--mint);background:rgba(0,0,0,.16);transition:border-color .15s,background .15s,box-shadow .15s}
.slot.filled{border-style:solid;border-color:rgba(81,230,202,.35);background:var(--mint-d);box-shadow:0 0 24px rgba(81,230,202,.12)}
.slot.next{border-color:rgba(81,230,202,.4)}
.slot.pressing{border-style:solid;border-color:var(--mint);animation:press .8s ease-in-out infinite}
.slot.miss{border-color:rgba(226,126,104,.4);background:var(--coral-d);color:var(--coral)}
@keyframes press{50%{box-shadow:0 0 0 4px rgba(81,230,202,.14)}}
.hero-state{text-align:center;font:600 19px var(--f-disp);display:flex;justify-content:center;align-items:center;gap:10px;min-height:28px}
.hero-sub{text-align:center;font-size:12px;color:var(--text-3);min-height:18px;margin-top:3px}
.ruler{position:relative;padding-top:20px;margin-top:14px}
.rz{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.03)}
.z{position:absolute;top:0;bottom:0}
.z.dot{background:rgba(81,230,202,.42);border-radius:2px}
.z.dash{background:rgba(117,183,255,.38);border-radius:2px}
.z.amb{background:repeating-linear-gradient(135deg,rgba(226,126,104,.3) 0 4px,transparent 4px 8px)}
.z.inv{background:rgba(255,255,255,.035)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:#fff;border-radius:1px;left:0;box-shadow:0 0 10px rgba(255,255,255,.55);opacity:0;transition:opacity .15s}
.needle.on{opacity:1}
.needle em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:600 10.5px var(--f-mono);font-style:normal;white-space:nowrap;margin-bottom:3px;color:var(--text)}
.rl{position:relative;height:16px;margin-top:8px;font-size:11px;color:var(--text-3)}
.rl span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rl span.amb{color:rgba(226,126,104,.85)}
.gapbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:12px;font-size:11px;color:var(--text-3)}
.gap-track{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.gap-track i{display:block;height:100%;width:0;background:var(--mint)}
.cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;min-height:28px}
.cands>span:first-child{font-size:11px;color:var(--text-3);margin-right:4px}
.cand{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:11.5px;color:var(--text-2)}
.cand .glyph{color:var(--text-3)}
.cand.hit{border-color:rgba(81,230,202,.35);color:var(--text)}.cand.hit .glyph{color:var(--mint)}
.cand.exact{background:var(--mint-d)}
.hero-ft{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-ft .hint{flex:1;font-size:11.5px;color:var(--text-3)}
.sim{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:8px;border:1px dashed rgba(81,230,202,.35);color:var(--mint);font-size:12px;font-weight:600}
.sim:active,.sim.down{background:var(--mint-d)}
.radio-list{display:grid;gap:6px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.15);text-align:left;width:100%;transition:border-color .15s,background .15s}
.radio:hover{border-color:var(--line-2)}
.radio .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-3);margin-top:1px;flex:none;position:relative}
.radio.on{border-color:rgba(81,230,202,.35);background:var(--mint-d)}
.radio.on .rd{border-color:var(--mint)}.radio.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--mint)}
.radio b{font-size:12.5px;font-weight:600;display:block}
.radio small{font-size:11px;color:var(--text-3);display:block;margin-top:2px;line-height:1.45}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--text-3)}
.kv b{font-weight:600;color:var(--text)}
.act{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.ic.ok{color:var(--mint);background:var(--mint-d)}.ic.miss{color:var(--coral);background:var(--coral-d)}
.ic.gesture{color:var(--blue);background:var(--blue-d)}.ic.sys{color:var(--text-3);background:var(--surface-2)}
.act .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .s{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden}
.act .s .glyph{color:var(--text-2)}
.act time{font:11px var(--f-mono);color:var(--text-3)}
.log{font:11.5px/1.85 var(--f-mono);color:var(--text-2);height:262px;overflow:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px;border:1px solid var(--line);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .tm{color:var(--text-4)}.log .hit{color:var(--mint)}.log .pass{color:var(--text-3)}.log .err{color:var(--coral)}

/* ---------- master / detail ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.split.flip{grid-template-columns:300px minmax(0,1fr)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.search{position:relative;flex:1}
.search svg{position:absolute;left:11px;top:10px;color:var(--text-3)}
.search .input{padding-left:34px}
.list-meta{font-size:11.5px;color:var(--text-3);margin:0 2px 10px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;transition:background .15s,border-color .15s}
.item:hover{background:var(--surface-2);border-color:var(--line-2)}
.item.sel{border-color:rgba(81,230,202,.4);background:rgba(81,230,202,.055);box-shadow:inset 3px 0 0 var(--mint)}
.item .n{font-size:13.5px;font-weight:600;display:block}
.item .tg{font:11.5px var(--f-mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;display:flex;align-items:center;gap:5px}
.inspector{position:sticky;top:0;padding:0;overflow:hidden}
.insp-hd{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.insp-hd h3{font:600 15px var(--f-disp);margin-top:5px;display:flex;align-items:center;gap:8px}
.insp-bd{padding:16px 18px 2px}
.insp-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.16)}
.sp{flex:1}
.composer{border:1px solid var(--line-2);border-radius:12px;background:rgba(0,0,0,.22);padding:10px}
.cslots{display:flex;gap:6px;margin-bottom:10px}
.cslot{flex:1;height:40px;border-radius:9px;border:1px dashed rgba(255,255,255,.12);display:grid;place-items:center;color:var(--mint)}
.cslot.filled{border-style:solid;border-color:rgba(81,230,202,.3);background:var(--mint-d)}
.cslot.err{border-color:rgba(226,126,104,.4);background:var(--coral-d);color:var(--coral)}
.cbtns{display:flex;gap:6px;align-items:center}
.cbtns .glyph{color:var(--mint)}
.cmsg{font-size:11.5px;margin-top:9px;display:flex;gap:6px;align-items:center}
.cmsg.ok{color:var(--mint)}.cmsg.err{color:var(--coral)}.cmsg.muted{color:var(--text-3)}
.empty{padding:34px 18px;text-align:center;color:var(--text-3);font-size:12.5px;border:1px dashed var(--line-2);border-radius:12px}
.chain{display:inline-flex;align-items:center;gap:4px;color:var(--text-3)}

/* gestures */
.pad{display:grid;grid-template-columns:repeat(3,140px);grid-template-rows:repeat(3,92px);gap:10px;justify-content:center;margin:6px 0 18px;transition:opacity .2s}
.pad.off{opacity:.4;pointer-events:none}
.dir{border-radius:14px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:border-color .15s,background .15s}
.dir:hover{border-color:var(--line-3);background:var(--surface-2)}
.dir.unbound{border-style:dashed}
.dir.sel{border-color:rgba(81,230,202,.5);background:rgba(81,230,202,.07);box-shadow:0 0 0 3px rgba(81,230,202,.08)}
.dir .ar{color:var(--text-2)}.dir.sel .ar{color:var(--mint)}
.dir .dl{font-size:11px;color:var(--text-3)}
.dir .bn{font-size:12.5px;font-weight:600;max-width:124px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir.unbound .bn{color:var(--text-4);font-weight:500}
.pad .center{grid-area:2/2;display:grid;place-items:center}
.pad .center div{width:76px;height:76px;border-radius:50%;border:1px solid var(--line-2);background:radial-gradient(circle,rgba(81,230,202,.1),transparent 70%);display:grid;place-items:center;color:var(--text-2);text-align:center;font-size:11px;gap:2px;padding-top:6px}
.srow{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);min-height:62px}
.srow:last-child{border-bottom:0}
.srow .info{flex:1;min-width:0}
.srow .nm{font-size:13px;font-weight:600}
.srow .ds{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.srow .ctl{display:flex;align-items:center;gap:10px}

/* workflows */
.steps-hd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 9px}
.steps-hd b{font-size:12px;font-weight:500;color:var(--text-2)}
.steps-hd b span{font:500 11px var(--f-mono);color:var(--text-3);margin-left:6px}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:24px auto minmax(0,1fr) 104px auto;gap:8px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.step .idx{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--text-2);background:var(--surface-2)}
.delay{position:relative}.delay .input{padding-right:30px;text-align:right;height:32px}
.delay em{position:absolute;right:10px;top:8px;font-size:11px;color:var(--text-3);font-style:normal}
.step .input.mono{height:32px}
.step-tools{display:flex;gap:2px}
.conn{height:18px;margin-left:19px;border-left:1px dashed var(--line-3)}
.wf-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

/* settings */
.settings-wrap{max-width:840px}
.sgroup{margin-bottom:20px}
.sgroup-t{font-size:12px;font-weight:600;color:var(--text-2);margin:0 2px 8px;display:flex;align-items:center;justify-content:space-between}
.srows{padding:2px 18px}
.pos{display:flex;gap:8px}
.pos button{width:86px;padding:8px 6px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.2);font-size:11.5px;color:var(--text-2);display:grid;gap:6px;justify-items:center}
.pos .scr{width:60px;height:36px;border-radius:4px;border:1px solid currentColor;opacity:.75;position:relative}
.pos .scr i{position:absolute;bottom:4px;width:18px;height:5px;border-radius:3px;background:currentColor}
.pos button.on{border-color:rgba(81,230,202,.45);color:var(--mint);background:var(--mint-d)}

/* status bar, toast, modal */
.statusbar{display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--line);background:rgba(0,0,0,.28);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.sb{display:flex;align-items:center;gap:7px}
.sb .sdot{width:7px;height:7px}
.toast{position:absolute;left:50%;bottom:44px;transform:translate(-50%,8px);background:#192026;border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:30;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--mint)}
.modal-bg{position:absolute;inset:44px 0 0 0;background:rgba(4,6,8,.62);display:none;place-items:center;z-index:20}
.modal-bg.show{display:grid;animation:in .15s ease}
.modal{width:420px;border-radius:14px;background:#12171c;border:1px solid var(--line-2);box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden}
.modal-bd{padding:20px 20px 16px;display:flex;gap:14px}
.modal-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--amber);background:var(--amber-d)}
.modal h4{font:600 15px var(--f-disp);margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.modal ol{margin:10px 0 0 18px;font:11.5px/1.8 var(--f-mono);color:var(--text-2)}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:rgba(0,0,0,.22);border-top:1px solid var(--line)}

/* on-screen Pulse Capsule (FeedbackWindow) */
.capsule{position:absolute;bottom:70px;height:56px;width:380px;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 22px 0 10px;background:rgba(14,18,22,.97);border:1px solid rgba(81,230,202,.44);box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:40}
.capsule.show{opacity:1;transform:none}
.capsule.pos-Center{left:50%;translate:-50% 0}.capsule.pos-Left{left:28px}.capsule.pos-Right{right:28px}
.capsule .orb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint-d);color:var(--mint);flex:none}
.capsule .cp{color:var(--mint);display:flex;align-items:center;min-width:24px}
.capsule .div{width:1px;height:22px;background:var(--line-2)}
.capsule .ct{display:grid;gap:1px;min-width:0;flex:1}
.capsule .ct small{font:600 9.5px var(--f-mono);letter-spacing:.12em;color:var(--text-3);text-transform:uppercase}
.capsule .ct span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capsule.failed{border-color:rgba(226,126,104,.8)}
.capsule.failed .orb{color:var(--coral);background:var(--coral-d)}.capsule.failed .cp{color:var(--coral)}
.capsule.breath{animation:breath 1.8s ease-in-out infinite}
@keyframes breath{50%{opacity:.74}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ rhythm simulation (mirrors RhythmEngine) ============ */
const R={pressedAt:null,lastRelease:null,seq:'',lastDur:null,lastPulse:null,phase:'idle',msg:'',hit:null,key:'',idleT:null};
function rDown(){
  if(!S.enabled){toast('监听已暂停，请在左下角恢复','info');return}
  if(R.pressedAt!=null)return;
  rTick(performance.now());
  clearTimeout(R.idleT);
  if(!R.seq&&R.phase!=='typing'){capsule('armed','',S.route===3?'指令模式已激活':'正在输入…')}
  R.pressedAt=performance.now();R.phase='press';
  log(`${btnName()} 按下`,'hit','[识别] 节奏输入');
}
function rUp(){
  if(R.pressedAt==null)return;
  const now=performance.now(),d=now-R.pressedAt,s=S.set;R.pressedAt=null;R.lastDur=d;
  if(d<35||d>s.longMax){R.lastPulse='x';rReset(`按住 ${Math.round(d)} ms 超出有效范围，已重置`);return}
  const p=d<=s.shortMax?'.':d>=s.longMin?'-':null;
  if(!p){R.lastPulse='x';rReset(`按住 ${Math.round(d)} ms 落在无效区（${s.shortMax}–${s.longMin} ms），已重置`);return}
  R.seq+=p;R.lastPulse=p;R.lastRelease=now;R.phase='typing';
  log(`${btnName()} 释放，时长 ${Math.round(d)} ms`,'hit','[识别] 节奏输入');
  const exact=S.commands.find(c=>c.pattern===R.seq);
  capsule('typing',R.seq,exact?exact.name:'正在输入…');
  if(R.seq.length>=5)rFinish();
}
function rTick(now){if(R.pressedAt==null&&R.lastRelease!=null&&now-R.lastRelease>=S.set.gap)rFinish()}
function rReset(msg){R.seq='';R.lastRelease=null;R.phase='reset';R.msg=msg;log(msg,'err','');capsule('failed','',msg.split('，')[0]);idleLater()}
function rCancel(){R.seq='';R.lastRelease=null;R.pressedAt=null;R.phase='idle';R.lastDur=null;hideCapsule();log('已取消本次输入');toast('已取消输入，恢复普通鼠标操作','info')}
function rFinish(){
  const pat=R.seq;R.seq='';R.lastRelease=null;if(!pat)return;
  const c=S.commands.find(x=>x.pattern===pat);
  if(c){R.phase='matched';R.hit={c,pat};execute(c,pat)}
  else{R.phase='miss';R.hit={pat};S.stats.miss++;addActivity({type:'miss',title:'未找到匹配的指令',p:pat});capsule('failed',pat,'未找到匹配指令');log(`没有匹配的指令: ${pat}`,'err','')}
  idleLater();
}
function idleLater(){clearTimeout(R.idleT);R.idleT=setTimeout(()=>{if(!R.seq&&R.pressedAt==null){R.phase='idle';R.lastDur=null}},3200)}
function updateLive(now){
  if(S.page!=='dashboard'||!$('#slots'))return;
  const pressing=R.pressedAt!=null,s=S.set;
  const key=[R.seq,pressing,R.phase,S.enabled,S.route,R.msg].join('|');
  if(key!==R.key){
    R.key=key;
    let slots='';
    for(let i=0;i<5;i++){
      const ch=R.seq[i];
      let cls=ch?'filled':(pressing&&i===R.seq.length)?'pressing':(R.seq.length&&i===R.seq.length)?'next':'';
      let inner=ch?glyph(ch,'lg'):'';
      if(R.phase==='miss'&&R.hit&&R.hit.pat[i]){cls='miss';inner=glyph(R.hit.pat[i],'lg')}
      if(R.phase==='matched'&&R.hit&&R.hit.pat[i]){cls='filled';inner=glyph(R.hit.pat[i],'lg')}
      slots+=`<span class="slot ${cls}">${inner}</span>`;
    }
    $('#slots').innerHTML=slots;
    let chip=['','待命'],st='等待输入',sub='';
    if(!S.enabled){chip=['','已暂停'];st='监听已暂停';sub='正常鼠标操作已恢复，在左下角重新开启监听'}
    else if(R.phase==='press'){chip=['live','按住中'];st=`第 ${R.seq.length+1} 位 · 正在计时`;sub='松开后按时长判定为 · 或 —'}
    else if(R.phase==='typing'){chip=['live','输入中'];st=`已输入 ${R.seq.length} 位`;sub=`停顿 ${s.gap} ms 后自动提交；Esc 取消`}
    else if(R.phase==='matched'){chip=['live','已匹配'];st=`${ic('check',18)} 已执行 · ${esc(R.hit.c.name)}`;sub=`${KINDS[R.hit.c.kind].zh} · ${esc(targetText(R.hit.c))}`}
    else if(R.phase==='miss'){chip=['bad','未匹配'];st='未找到匹配的指令';sub='可以在指令库中为这个节奏绑定动作'}
    else if(R.phase==='reset'){chip=['bad','已重置'];st='本次输入无效';sub=R.msg}
    else{sub=S.route===3?`静止长按中键 ${s.middleHold} ms 激活，然后用左键输入节奏`:'按住侧键输入节奏；松开后停顿即提交'}
    $('#hero-chip').className='state '+chip[0];$('#hero-chip').innerHTML=`<i></i>${chip[1]}`;
    $('#hero-state').innerHTML=st;$('#hero-sub').textContent=sub;
    $('#hero-hint').textContent=S.route===3?'当前：中键长按 + 左键':'当前：'+ROUTES[S.route].active;
    const seq=R.seq;
    let cands;
    if(seq){const m=S.commands.filter(c=>c.pattern.startsWith(seq)).sort((a,b)=>a.pattern.length-b.pattern.length);
      cands=`<span>匹配候选</span>`+(m.length?m.map(c=>`<span class="cand hit ${c.pattern===seq?'exact':''}">${glyph(c.pattern)}${esc(c.name)}</span>`).join(''):`<span class="cand">没有以此开头的指令</span>`)}
    else cands=`<span>已绑定节奏</span>`+S.commands.map(c=>`<span class="cand">${glyph(c.pattern)}${esc(c.name)}</span>`).join('');
    $('#cands').innerHTML=cands;
  }
  const n=$('#hr-n'),v=$('#hr-v');
  if(pressing){const d=now-R.pressedAt;n.classList.add('on');n.style.left=pct(d);v.textContent=Math.round(d)+' ms';
    n.style.background=d<=s.shortMax?'var(--mint)':d<s.longMin||d>s.longMax?'var(--coral)':'var(--blue)'}
  else if(R.lastDur!=null){n.classList.add('on');n.style.left=pct(R.lastDur);v.textContent=Math.round(R.lastDur)+' ms → '+(R.lastPulse==='.'?'·':R.lastPulse==='-'?'—':'无效')}
  else n.classList.remove('on');
  $('#gap-fill').style.width=(!pressing&&R.lastRelease!=null)?Math.min(100,(now-R.lastRelease)/s.gap*100)+'%':'0%';
}
function loop(){const now=performance.now();rTick(now);updateLive(now);requestAnimationFrame(loop)}

/* ============ execution / capsule / modal ============ */
function execute(c,pat,source){
  const run=()=>{
    capsule('typing',source==='gesture'?'':pat||'',`${c.name} · 正在执行`,source==='gesture'?DIRS[pat].icon:null);
    setTimeout(()=>{
      S.stats.today++;
      if(source==='gesture')addActivity({type:'gesture',title:c.name,dir:pat,kind:c.kind,target:c.target});
      else addActivity({type:'ok',title:c.name,p:c.pattern,kind:c.kind,target:targetText(c)});
      log(`已请求执行：${c.name}`,'hit','');
      capsule('matched',source==='gesture'?'':pat||c.pattern,`${c.name} · 已发起`,source==='gesture'?DIRS[pat].icon:null);
    },380);
  };
  if(c.kind==='workflow'&&S.set.confirmWf){
    modal({title:`执行工作流「${c.name}」？`,body:`将按顺序执行 ${c.steps.length} 个本地动作。可在 设置 › 安全与数据 中关闭此确认。`,
      list:c.steps.map(s=>`${KINDS[s.kind].zh}  ${s.target}${s.delay?`  (等待 ${s.delay} ms)`:''}`),ok:'执行',onOk:run,onCancel:()=>{hideCapsule();log('用户取消了工作流执行')}});
  }else run();
}
let capT;
function capsule(mode,pat,text,iconName){
  if(!S.set.capsule)return;
  const el=$('#capsule');
  el.className=`capsule show pos-${S.set.capsulePos} ${mode==='failed'?'failed':''} ${S.set.breathing&&(mode==='armed'||mode==='typing')?'breath':''}`;
  $('#cap-orb').innerHTML=iconName?ic(iconName,18):mode==='matched'?ic('check',18):mode==='failed'?ic('x',18):ic(mode==='armed'?'dot':'mouse',18);
  $('#cap-p').innerHTML=pat?glyph(pat,'md'):'';
  $('#cap-p').style.display=pat?'flex':'none';
  $('#cap-t').textContent=text;
  clearTimeout(capT);
  if(mode==='matched'||mode==='failed')capT=setTimeout(hideCapsule,mode==='failed'?1600:1150);
}
function hideCapsule(){$('#capsule').classList.remove('show','breath')}
let modalCb={};
function modal({title,body,list,ok='确认',danger,onOk,onCancel}){
  modalCb={onOk,onCancel};
  const m=$('#modal');
  m.innerHTML=`<div class="modal"><div class="modal-bd"><span class="modal-ic" style="${danger?'color:var(--coral);background:var(--coral-d)':''}">${ic(danger?'trash':'shield',18)}</span><div><h4>${esc(title)}</h4><p>${esc(body)}</p>${list?`<ol>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}</div></div>
    <div class="modal-ft"><button class="btn" data-act="modal-cancel">取消</button><button class="btn ${danger?'danger':'primary'}" data-act="modal-ok">${esc(ok)}</button></div></div>`;
  m.classList.add('show');
}
function closeModal(){$('#modal').classList.remove('show')}

/* ============ composer (shared) ============ */
function conflictOf(p,exId){return p?S.commands.find(c=>c.pattern===p&&c.id!==exId):null}
function composerHTML(ctx,p,exId){
  const cf=conflictOf(p,exId);
  const msg=!p?['muted','info','点击添加短按 · 或长按 —，最多 5 位']:cf?['err','alert',`该节奏已被「${cf.name}」占用`]:['ok','check','节奏可用'];
  let slots='';for(let i=0;i<5;i++)slots+=p[i]?`<span class="cslot filled ${cf?'err':''}">${glyph(p[i],'md')}</span>`:'<span class="cslot"></span>';
  return `<div class="composer" id="comp-${ctx}"><div class="cslots">${slots}</div>
    <div class="cbtns"><button class="btn sm" data-act="pat-add" data-ctx="${ctx}" data-c=".">${glyph('.')}短按</button><button class="btn sm" data-act="pat-add" data-ctx="${ctx}" data-c="-">${glyph('-')}长按</button><span class="sp"></span>
    <button class="btn sm icon ghost" data-act="pat-back" data-ctx="${ctx}" title="退格">${ic('back',15)}</button><button class="btn sm ghost" data-act="pat-clear" data-ctx="${ctx}">清空</button></div>
    <div class="cmsg ${msg[0]}">${ic(msg[1],13)}${esc(msg[2])}</div></div>`;

function validTarget(kind,t){
  if(!t.trim())return '目标不能为空';

function saveCmd(){
  const d=S.draft;
  if(!d.name.trim())return toast('请填写名称','alert');

  if(conflictOf(d.pattern,d.id))return toast('该节奏已经被占用','alert');
  if(d.kind!=='workflow'){const e=validTarget(d.kind,d.target);if(e)return toast(e,'alert')}
  if(d.id){const i=S.commands.findIndex(c=>c.id===d.id);S.commands[i]={...S.commands[i],...clone(d)}}
  else{d.id=++uid;S.commands.push(clone(d))}

}

  const wfs=S.commands.filter(c=>c.kind==='workflow');

  const list=wfs.length?wfs.map(w=>`<button class="item ${S.wfSel===w.id?'sel':''}" style="grid-template-columns:64px minmax(0,1fr)" data-act="wf-sel" data-id="${w.id}"><span class="pchip">${glyph(w.pattern,'md')}</span><span style="min-width:0"><span class="n">${esc(w.name)}</span><span class="tg"><span class="chain">${w.steps.map(s=>ic(s.kind,13)).join('<span>›</span>')}</span>${w.steps.length} 步</span></span></button>`).join(''):`<div class="empty">还没有工作流</div>`;

  </section></div>`;
}
function saveWf(){
  const d=S.wfDraft;
  if(!d.name.trim())return toast('请填写名称','alert');
  if(!d.pattern)return toast('请添加 1–5 位节奏','alert');
  if(conflictOf(d.pattern,d.id))return toast('该节奏已经被占用','alert');
  for(const [i,s] of d.steps.entries()){
    const e=validTarget(s.kind,s.target);if(e)return toast(`第 ${i+1} 步：${e}`,'alert');
    const v=+s.delay;if(!Number.isInteger(v)||v<0||v>5000)return toast(`第 ${i+1} 步：延迟需为 0–5000 ms`,'alert');
    s.delay=v;
  }
  if(d.id){const i=S.commands.findIndex(c=>c.id===d.id);S.commands[i]=clone(d)}
  else{d.id=++uid;S.commands.push(clone(d))}
  S.wfSel=d.id;saved(true);toast(`已保存「${d.name}」`);renderSidebar();renderWorkflows();
}

  browse:a=>{const k=a.dataset.kind,v=k==='folder'?'D:\\Downloads':'C:\\Program Files\\Microsoft VS Code\\Code.exe';const inp=a.parentElement.querySelector('input');inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));toast('演示：已从系统文件选择器选取','info')},
  'pat-add':a=>{const d=draftOf(a.dataset.ctx);if(d.pattern.length>=5)return toast('节奏最多 5 位','alert');d.pattern+=a.dataset.c;refreshComposer(a.dataset.ctx)},
  'pat-back':a=>{const d=draftOf(a.dataset.ctx);d.pattern=d.pattern.slice(0,-1);refreshComposer(a.dataset.ctx)},
  'pat-clear':a=>{draftOf(a.dataset.ctx).pattern='';refreshComposer(a.dataset.ctx)},
  'g-toggle':()=>{S.gesturesEnabled=!S.gesturesEnabled;saved(true);renderGestures()},
  'g-sel':a=>{selectG(a.dataset.dir);renderGestures()},
  'g-save':()=>{const d=S.gDraft;if(!d.name.trim())return toast('请填写名称','alert');const e=validTarget(d.kind,d.target);if(e)return toast(e,'alert');S.gestures[S.gSel]=clone(d);saved(true);toast(`已保存向${DIRS[S.gSel].zh}手势`);renderSidebar();renderGestures()},
  'g-clear':()=>{S.gestures[S.gSel]=null;selectG(S.gSel);saved(true);toast('已清除绑定');renderSidebar();renderGestures()},
  'g-test':()=>{const g=S.gestures[S.gSel];if(g){log(`识别中键方向手势 ${S.gSel}`);execute({...g,pattern:''},S.gSel,'gesture')}},
  'wf-new':()=>{selectWf(null);S.wfSel=null;renderWorkflows();$('[data-wbind="name"]').focus()},
  'wf-sel':a=>{selectWf(+a.dataset.id);renderWorkflows()},
  'wf-save':saveWf,
  'wf-del':()=>{const d=S.wfDraft;modal({title:`删除工作流「${d.name}」？`,body:'删除后会立即写入配置，可通过导入备份恢复。',ok:'删除',danger:true,onOk:()=>{S.commands=S.commands.filter(c=>c.id!==d.id);S.wfDraft=null;S.wfSel=null;saved(true);toast('已删除');renderSidebar();renderWorkflows()}})},
  'wf-test':()=>{const c=S.commands.find(x=>x.id===S.wfDraft.id);if(c)execute(c,c.pattern)},
  'wf-json':()=>{const j=JSON.stringify(S.wfDraft.steps.map(s=>({Kind:KINDS[s.kind].num,Target:s.target,DelayMs:+s.delay||0})),null,2);try{navigator.clipboard.writeText(j)}catch(e){}toast('已复制 JSON（兼容 v0.7 格式）')},
  'step-add':()=>{if(S.wfDraft.steps.length>=12)return;S.wfDraft.steps.push({kind:'app',target:'',delay:0});renderWorkflows()},
  'step-del':a=>{S.wfDraft.steps.splice(+a.dataset.i,1);renderWorkflows()},
  'step-up':a=>{const i=+a.dataset.i,s=S.wfDraft.steps;[s[i-1],s[i]]=[s[i],s[i-1]];$('#steps').innerHTML=stepsHTML()},
  'step-down':a=>{const i=+a.dataset.i,s=S.wfDraft.steps;[s[i+1],s[i]]=[s[i],s[i+1]];$('#steps').innerHTML=stepsHTML()},
  'step-kind':a=>{S.wfDraft.steps[+a.dataset.i].kind=a.dataset.k;$('#steps').innerHTML=stepsHTML()},
  'set-toggle':a=>{const k=a.dataset.k;S.set[k]=!S.set[k];a.classList.toggle('on',S.set[k]);if(k==='capsule'&&!S.set.capsule)hideCapsule();saved()},
  lang:a=>{S.lang=a.dataset.k;saved();renderAll()},
  'cap-pos':a=>{S.set.capsulePos=a.dataset.k;saved();renderSettings();H['cap-preview']()},
  'cap-preview':()=>{if(!S.set.capsule)return toast('请先启用状态胶囊','info');capsule('matched','.-','打开计算器 · 已发起')},
  'reset-timing':()=>{Object.assign(S.set,DEF_T);saved();renderSettings()},
  export:()=>toast('演示：已导出 PulseMouse-backup-20261013.json'),
  import:()=>modal({title:'导入配置？',body:'将用备份文件替换当前的指令、手势与偏好，导入后立即生效，无需重启。',ok:'选择文件并导入',onOk:()=>toast('演示：配置已导入并生效')}),
  'open-cfg':()=>toast('演示：打开 %LOCALAPPDATA%\\PulseMouse','info'),
  'open-ai':()=>{/^https:\/\//i.test(S.set.aiUrl)?toast('演示：在默认浏览器打开 '+S.set.aiUrl,'info'):toast('AI 网址必须为 HTTPS','alert')},
  'modal-ok':()=>{closeModal();modalCb.onOk&&modalCb.onOk()},
  'modal-cancel':()=>{closeModal();modalCb.onCancel&&modalCb.onCancel()},
};
function rCancelSilent(){R.seq='';R.lastRelease=null;R.pressedAt=null;R.phase='idle';R.lastDur=null}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=H[a.dataset.act];if(f)f(a,e)});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset;
  if(ds.bind&&S.page==='commands'){S.draft[ds.bind]=t.value}
  else if(ds.gbind)S.gDraft[ds.gbind]=t.value;
  else if(ds.bind==='g-target')S.gDraft.target=t.value;
  else if(ds.wbind)S.wfDraft[ds.wbind]=t.value;
  else if(ds.step)S.wfDraft.steps[+ds.i][ds.step]=t.value;
  else if(ds.sbind){S.set[ds.sbind]=t.value;saved(true)}
  else if(t.id==='cmd-q'){S.cmdQuery=t.value;$('#cmd-list').innerHTML=cmdListHTML()}
  else if(ds.range){
    let v=+t.value;const k=ds.range;
    t.style.setProperty('--p',((v-t.min)/(t.max-t.min)*100)+'%');
    if(k==='gdist'){S.gestureDist=v;$('#gdist-v').textContent=v+' px';saved(true);return}
    if(k==='longMin'&&v<S.set.shortMax+50){v=S.set.shortMax+50;t.value=v}
    S.set[k]=v;$('#rv-'+k).textContent=v+' ms';
    if(k==='shortMax'&&S.set.longMin<v+50){S.set.longMin=v+50;const o=$('[data-range="longMin"]');o.value=S.set.longMin;o.style.setProperty('--p',((S.set.longMin-o.min)/(o.max-o.min)*100)+'%');$('#rv-longMin').textContent=S.set.longMin+' ms'}
    refreshRulers();saved(true);
  }
});
document.addEventListener('change',e=>{if(e.target.dataset.range&&e.target.dataset.range!=='gdist')toast('节奏识别参数已保存')});
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')};
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!typing()){e.preventDefault();if(!e.repeat)rDown()}
  if(e.key==='Escape'){if($('#modal').classList.contains('show'))H['modal-cancel']();else if(R.seq||R.pressedAt!=null)rCancel()}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&!typing()){e.preventDefault();rUp()}});
$('#titlebar').addEventListener('dblclick',e=>{if(!e.target.closest('button'))H['win-max']()});

function fit(){const d=$('#desktop');if(document.body.classList.contains('real')){d.style.transform='none';return}const s=Math.min(innerWidth/1500,innerHeight/1000);d.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);
setInterval(()=>{S.stats.weekSec++;const w=$('#st-week');if(w)w.textContent=fmtH();$('#clock').textContent=new Date().toTimeString().slice(0,5)},1000);

fit();renderStatus();go('dashboard');requestAnimationFrame(loop);
</script>
</body>
